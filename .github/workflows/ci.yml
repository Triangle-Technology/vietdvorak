name: CI

# Cổng duy nhất mà một PR phải qua. Nguyên tắc: mọi thứ ở đây phải FAIL được —
# một job không bao giờ đỏ được là một job không kiểm gì cả.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  spec:
    # Windows vì đây là job DUY NHẤT chạy được cả ba engine: VietDvorak.ahk cần
    # AutoHotkey, và AutoHotkey chỉ có trên Windows. Không tách nhỏ ra — giá trị
    # của check-parity.mjs nằm ở chỗ ba engine được so với nhau TRONG MỘT LẦN
    # CHẠY, nên chia nó ra nhiều job là vứt bỏ đúng thứ nó đo.
    name: spec — three engines
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # AutoHotkey được PIN theo version VÀ theo SHA256, khác với các bước khác.
      # Lý do: đây là binary bên thứ ba mà CI đem THỰC THI. Với một dự án mà
      # bản thân sản phẩm đọc mọi phím người dùng gõ, "tải bản mới nhất rồi
      # chạy" là một bề mặt cung ứng không tương xứng với phần còn lại.
      #
      # Nâng version là một hành động CÓ CHỦ Ý và phải thấy được trong diff:
      # đổi cả hai dòng dưới. 2.0.26 là bản chủ dự án đang chạy trên máy, nên CI
      # và máy dev thực thi cùng một engine — nếu chúng khác nhau thì "xanh trên
      # CI, đỏ ở nhà" trở thành một khả năng, và đó là loại lỗi đắt nhất.
      - name: Install AutoHotkey v2 (pinned)
        shell: pwsh
        run: |
          $version = '2.0.26'
          $expected = '43522AA3122A57784AC5DB30ABF85C2244475C36ACD7796E2C993355F9E926AE'
          $zip = Join-Path $env:RUNNER_TEMP 'ahk.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'ahk'
          $url = "https://github.com/AutoHotkey/AutoHotkey/releases/download/v$version/AutoHotkey_$version.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($actual -ne $expected) {
            throw "AutoHotkey_$version.zip has SHA256 $actual, expected $expected. Refusing to run it."
          }
          Expand-Archive -Path $zip -DestinationPath $dir
          $exe = Join-Path $dir 'AutoHotkey64.exe'
          if (-not (Test-Path $exe)) { throw "AutoHotkey64.exe not found in the archive" }
          Add-Content -Path $env:GITHUB_ENV -Value "AUTOHOTKEY_EXE=$exe"

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Unit tests
        run: cargo test --workspace --locked

      # Bản checkable của lời hứa trong crates/vietdvorak-core/Cargo.toml. Mọi
      # crate trên đường đi của phím đọc được mọi thứ người dùng gõ, nên "zero
      # dependency" là một thuộc tính BẢO MẬT — và một thuộc tính bảo mật chỉ
      # tồn tại trong comment là một thuộc tính sẽ biến mất trong PR nào đó.
      - name: The core has no dependencies
        shell: pwsh
        run: |
          $deps = cargo tree -p vietdvorak-core --edges normal --prefix none --locked |
                  Select-Object -Skip 1 | Where-Object { $_.Trim() }
          if ($deps) {
            throw "vietdvorak-core must have zero dependencies, found:`n$($deps -join "`n")"
          }

      # Verdict thật. Chạy CUỐI vì nó là thứ đắt nhất và là thứ duy nhất cần cả
      # ba engine — nếu fmt/clippy/test đã đỏ thì không cần biết thêm.
      - name: Conformance — all three engines
        run: node check-parity.mjs

      # README.md và ROADMAP.md chép nguyên văn dòng PASS để người đọc thấy ngay
      # dự án đang ở đâu. Con số trong đó là dữ liệu, và dữ liệu bị chép tay ở
      # ba chỗ thì hai chỗ sẽ sai — thêm một vector là hai tài liệu lặng lẽ nói
      # dối, đúng thứ repo này bắt lỗi rất gắt ở mọi chỗ khác.
      #
      # Không bỏ con số khỏi tài liệu: chính con số cụ thể làm chúng thuyết
      # phục. Thay vào đó bắt chúng phải đúng.
      - name: The docs quote the current PASS line verbatim
        shell: pwsh
        run: |
          $out = node check-parity.mjs
          if ($LASTEXITCODE -ne 0) { throw "check-parity failed; earlier step should have caught this" }
          $line = $out[0].Trim()
          foreach ($doc in 'README.md', 'ROADMAP.md') {
            if (-not (Select-String -Path $doc -SimpleMatch -Pattern $line -Quiet)) {
              throw "$doc does not quote the current verdict.`nExpected to find: $line"
            }
            Write-Host "$doc quotes it"
          }

      # Giữ đúng lời hứa in ra ở đầu check-parity.mjs: bỏ qua một engine mua
      # được một lần chạy yên tĩnh hơn, KHÔNG mua được một lần chạy xanh. Không
      # có bước này thì lời hứa đó chỉ là văn xuôi, và một PR "sửa" hai cờ kia
      # thành exit 0 sẽ đi qua mà không ai thấy — rồi CI xanh mãi mãi với engine
      # chưa từng được chạy một lần nào.
      - name: A skipped engine can never be green
        shell: pwsh
        run: |
          foreach ($flag in '--skip-ahk', '--skip-rust') {
            node check-parity.mjs $flag | Out-Null
            if ($LASTEXITCODE -eq 0) { throw "$flag exited 0 — half a check is not a pass" }
            Write-Host "$flag exited $LASTEXITCODE, as it must"
          }
          # Bước này CỐ Ý kết thúc bằng một lệnh thất bại, mà shell pwsh của
          # GitHub Actions đóng step bằng `exit $LASTEXITCODE` — nên không có dòng
          # này thì step thừa hưởng đúng cái exit code nó vừa khẳng định là phải
          # khác 0, và một bước ĐANG ĐÚNG lại làm build đỏ.
          exit 0

      # Bước "Install AutoHotkey v2" ở trên là thứ duy nhất đứng giữa job này và
      # một lần chạy chỉ có hai engine. Nếu nó hỏng — URL đổi, asset đổi tên,
      # zip đổi cấu trúc — parity PHẢI đỏ, chứ không được lặng lẽ tụt xuống còn
      # JS + Rust và vẫn in ra một dòng nghe như thành công.
      #
      # Hành vi đã đúng sẵn (findAutoHotkey -> loudSkip -> exit khác 0). Bước
      # này tồn tại vì cho tới lúc có nó, điều đó mới chỉ được kiểm BẰNG TAY một
      # lần, và một guard chưa được chứng minh là cắn thì chưa phải một guard.
      - name: A broken AutoHotkey install must turn the build red
        shell: pwsh
        env:
          AUTOHOTKEY_EXE: C:\nonexistent\AutoHotkey64.exe
        run: |
          node check-parity.mjs | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "missing AutoHotkey exited 0 — a broken install must be red" }
          Write-Host "missing AutoHotkey exited $LASTEXITCODE, as it must"
          exit 0   # xem chú thích ở bước trên

  linux-gate:
    # Lõi còn compile cho Linux không. `check` chứ không phải `build`: xem lý do
    # trong rust-toolchain.toml. Job này tồn tại để shell IBus sắp tới không bắt
    # đầu bằng việc phát hiện lõi đã lệch khỏi target thật từ lâu.
    name: linux gate — musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for x86_64-unknown-linux-musl
        run: cargo check --workspace --all-targets --locked --target x86_64-unknown-linux-musl
